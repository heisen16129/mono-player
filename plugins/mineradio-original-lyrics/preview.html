<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio 原版歌词插件预览</title>
  <style>html,body,#root{width:100%;height:100%;margin:0;background:#070708;overflow:hidden}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import renderer from './renderer.mjs';

    function makeCover(colors, label) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 640;
      const cx = canvas.getContext('2d');
      const gradient = cx.createLinearGradient(0, 0, 640, 640);
      gradient.addColorStop(0, colors[0]);
      gradient.addColorStop(1, colors[1]);
      cx.fillStyle = gradient;
      cx.fillRect(0, 0, 640, 640);
      cx.fillStyle = 'rgba(255,255,255,.18)';
      for (let i = 0; i < 18; i += 1) cx.fillRect(42 + i * 30, 48, 12, 420 + (i % 4) * 28);
      cx.fillStyle = '#fff';
      cx.font = '900 72px sans-serif';
      cx.fillText(label, 54, 565);
      return canvas.toDataURL('image/png');
    }

    const covers = [
      makeCover(['#1f476a', '#ed5a45'], '逆战'),
      makeCover(['#10151e', '#a873d1'], '白素贞'),
      makeCover(['#294337', '#d3a75f'], '星河'),
    ];
    const texts = ['风从很远的地方经过', '城市的灯落进沉默', '时间沿着夜色缓慢流动', '我们在星光里面重逢', '那些没有说完的话', '正在记忆深处发芽', '如果明天仍然有风', '就让歌声带我们出发'];
    const lines = texts.map((value, index) => {
      const time = 3 + index * 5.5;
      const chars = [...value];
      return {
        time,
        text: value,
        words: chars.map((char, wordIndex) => ({
          time: time + wordIndex * (4.5 / chars.length),
          duration: 4.5 / chars.length,
          text: char,
        })),
      };
    });
    const queueTracks = Array.from({ length: 12 }, (_, index) => ({
      id: `preview-${index}`,
      title: ['逆战', '白素贞', '星河漫游'][index % 3] + (index > 2 ? ` ${index + 1}` : ''),
      artist: ['张杰', '裘杰', 'Mono Session'][index % 3],
      album: 'Mineradio 原版预览',
      duration: 231 + index * 7,
      artworkDataUrl: covers[index % covers.length],
    }));
    const state = {
      activeTrack: queueTracks[0],
      queueTracks,
      lines,
      currentTime: 16,
      duration: queueTracks[0].duration,
      isPlaying: true,
      isFavorite: false,
      volume: 72,
      playbackRate: 1,
      playbackMode: 'fixed',
      config: {},
    };
    const update = () => renderer.update(state);
    await renderer.mount(document.querySelector('#root'), state, {
      post(action, payload = {}) {
        console.log('[预览宿主]', action, payload);
        if (action === 'togglePlayback') state.isPlaying = !state.isPlaying;
        if (action === 'playPrevious' || action === 'playNext') {
          const current = state.queueTracks.findIndex((track) => track.id === state.activeTrack.id);
          const delta = action === 'playNext' ? 1 : -1;
          state.activeTrack = state.queueTracks[(current + delta + state.queueTracks.length) % state.queueTracks.length];
          state.duration = state.activeTrack.duration;
          state.currentTime = 0;
        }
        if (action === 'toggleFavorite') state.isFavorite = !state.isFavorite;
        if (action === 'seekTime') state.currentTime = Number(payload.time) || 0;
        if (action === 'setVolume') state.volume = Number(payload.value) || 0;
        if (action === 'playQueueTrack' && state.queueTracks[payload.index]) {
          state.activeTrack = state.queueTracks[payload.index];
          state.duration = state.activeTrack.duration;
          state.currentTime = 0;
        }
        update();
      },
    });
    setInterval(() => {
      if (state.isPlaying) state.currentTime = (state.currentTime + 0.1) % state.duration;
      const now = performance.now() / 1000;
      renderer.updateAudioSpectrum([
        .18 + Math.max(0, Math.sin(now * 2.7)) * .7,
        .12 + Math.max(0, Math.sin(now * 2.1 + .8)) * .55,
        .1 + Math.max(0, Math.sin(now * 3.4 + 1.3)) * .42,
        .16 + Math.max(0, Math.sin(now * 1.8 + .4)) * .46,
        Math.max(0, Math.sin(now * 3.7)) * .8,
      ]);
      update();
    }, 100);
  </script>
</body>
</html>
