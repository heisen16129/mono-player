<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apple Music 歌词插件预览</title>
  <style>html,body,#root{width:100%;height:100%;margin:0;background:#09090a;overflow:hidden}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import renderer from './renderer.mjs';

    const lyricTexts = [
      '等风吹过盛夏的街',
      '把没说完的话写成一页',
      '远处灯火一盏一盏熄灭',
      '而你的名字仍停在唇边',
      '时间向前 我们都没有告别',
      '只是在人海里走得远了一些',
      '如果重逢发生在某个雨天',
      '我会笑着说 好久不见',
      '那些绕过城市的思念',
      '终于落在同一条地平线',
      '夜色很慢 心跳很浅',
      '故事还留着温柔的悬念',
      '等风再一次吹过窗前',
      '我们会不会回到那一年',
    ];
    const lines = lyricTexts.map((text, index) => {
      const time = 12 + index * 8;
      const chars = [...text];
      return {
        time,
        text,
        words: chars.map((char, wordIndex) => ({
          time: time + wordIndex * (5.8 / chars.length),
          duration: 5.8 / chars.length,
          text: char,
        })),
      };
    });
    const queue = [
      ['1', '盛夏未完成', 'Mono Session', '晚风来信', 228],
      ['2', '雨落地平线', 'Mono Session', '晚风来信', 244],
      ['3', '城市漫游', 'Clara Lin', 'Night Walk', 196],
      ['4', '好久不见', 'Mono Session', '晚风来信', 215],
      ['5', 'Last Light', 'Aster', 'Afterglow', 251],
    ].map(([id, title, artist, album, duration]) => ({ id, title, artist, album, duration }));
    const state = {
      lines,
      currentTime: 62,
      isPlaying: true,
      isFavorite: true,
      activeLyricIndex: 6,
      coverUrl: '/examples/themes/soft-mint/background.png',
      isLoading: false,
      emptyMessage: '暂无歌词',
      loadingText: '正在载入歌词…',
      title: '盛夏未完成（现场特别版）',
      artist: 'Mono Session',
      album: '晚风来信',
      duration: 228,
      volume: 72,
      isMuted: false,
      locale: 'zh-CN',
      playbackRate: 1,
      playbackMode: 'repeat',
      playbackModeLabel: '列表循环',
      activeTrackId: '1',
      queue,
      config: {},
    };
    const update = () => {
      state.activeLyricIndex = Math.max(-1, lines.findLastIndex((line) => line.time <= state.currentTime));
      renderer.update(state);
    };
    const api = {
      post(action, payload = {}) {
        if (action === 'togglePlayback') state.isPlaying = !state.isPlaying;
        if (action === 'toggleFavorite') state.isFavorite = !state.isFavorite;
        if (action === 'toggleMute') state.isMuted = !state.isMuted;
        if (action === 'seekTime') state.currentTime = Number(payload.time) || 0;
        if (action === 'setVolume') state.volume = Number(payload.value) || 0;
        if (action === 'setPlaybackRate') state.playbackRate = Number(payload.value) || 1;
        if (action === 'togglePlaybackMode') {
          const modes = ['repeat', 'shuffle', 'fixed'];
          state.playbackMode = modes[(modes.indexOf(state.playbackMode) + 1) % modes.length];
          state.playbackModeLabel = { repeat: '列表循环', shuffle: '随机播放', fixed: '单曲循环' }[state.playbackMode];
        }
        if (action === 'updateConfig') state.config = payload.config || {};
        if (action === 'playQueueTrack') state.activeTrackId = queue[payload.index]?.id || state.activeTrackId;
        update();
      },
    };
    renderer.mount(document.querySelector('#root'), state, api);
    setInterval(() => {
      if (!state.isPlaying) return;
      state.currentTime = (state.currentTime + 0.1 * state.playbackRate) % state.duration;
      update();
    }, 100);
  </script>
</body>
</html>
