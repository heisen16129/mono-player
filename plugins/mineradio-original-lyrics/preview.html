<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mineradio 原版歌词插件预览</title>
  <style>html,body,#root{width:100%;height:100%;margin:0;background:#070708;overflow:hidden}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import renderer from './renderer.mjs';

    function makeCover(colors, label) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 640;
      const cx = canvas.getContext('2d');
      const gradient = cx.createLinearGradient(0, 0, 640, 640);
      gradient.addColorStop(0, colors[0]);
      gradient.addColorStop(1, colors[1]);
      cx.fillStyle = gradient;
      cx.fillRect(0, 0, 640, 640);
      cx.fillStyle = 'rgba(255,255,255,.18)';
      for (let i = 0; i < 18; i += 1) cx.fillRect(42 + i * 30, 48, 12, 420 + (i % 4) * 28);
      cx.fillStyle = '#fff';
      cx.font = '900 72px sans-serif';
      cx.fillText(label, 54, 565);
      return canvas.toDataURL('image/png');
    }

    const covers = [
      makeCover(['#1f476a', '#ed5a45'], '逆战'),
      makeCover(['#10151e', '#a873d1'], '白素贞'),
      makeCover(['#294337', '#d3a75f'], '星河'),
    ];
    const texts = ['风从很远的地方经过', '城市的灯落进沉默', '时间沿着夜色缓慢流动', '我们在星光里面重逢', '那些没有说完的话', '正在记忆深处发芽', '如果明天仍然有风', '就让歌声带我们出发'];
    const lines = texts.map((value, index) => {
      const time = 3 + index * 5.5;
      const chars = [...value];
      return {
        time,
        text: value,
        words: chars.map((char, wordIndex) => ({
          time: time + wordIndex * (4.5 / chars.length),
          duration: 4.5 / chars.length,
          text: char,
        })),
      };
    });
    const queueTracks = Array.from({ length: 12 }, (_, index) => ({
      id: `preview-${index}`,
      path: `preview-${index}`,
      title: ['逆战', '白素贞', '星河漫游'][index % 3] + (index > 2 ? ` ${index + 1}` : ''),
      artist: ['张杰', '裘杰', 'Mono Session'][index % 3],
      album: 'Mineradio 原版预览',
      duration: 231 + index * 7,
      artworkDataUrl: covers[index % covers.length],
    }));
    const state = {
      activeTrack: queueTracks[0],
      queueTracks,
      lines,
      background: { source: 'cover', opacity: .72, windowOpacity: 1, blur: 24, positionX: 50, positionY: 50, scale: 1 },
      config: {},
      playback: { currentTime: 16, isPlaying: true, isFavorite: false, volume: 72, isMuted: false, playbackRate: 1, playbackMode: 'fixed', playbackModeLabel: '固定播放' },
      lyricsUi: { activeLyricIndex: 2, lyricTimeOffset: 0, fontSize: 17, lyricColor: null, useThemeLyricColor: true, isLoading: false, loadingText: '正在载入歌词…', emptyMessage: '暂无歌词', locale: 'zh-CN' },
    };
    const trackKey = () => `${state.activeTrack.id}:${state.activeTrack.path}`;
    const updatePlayback = () => {
      state.lyricsUi.activeLyricIndex = state.lines.findLastIndex((line) => line.time <= state.playback.currentTime);
      renderer.update({ type: 'playback', playback: state.playback });
      renderer.update({ type: 'lyrics-ui', lyricsUi: state.lyricsUi });
    };
    const updateTrack = () => {
      renderer.update({ type: 'track', trackKey: trackKey(), activeTrack: state.activeTrack });
      renderer.update({ type: 'lyrics', trackKey: trackKey(), lines: state.lines });
    };
    const sendSnapshot = () => {
      updateTrack();
      renderer.update({ type: 'queue', queueTracks: state.queueTracks });
      renderer.update({ type: 'background', background: state.background });
      renderer.update({ type: 'config', config: state.config });
      updatePlayback();
    };
    let audioFrameSequence = 0;
    const previewAudioFrame = () => {
      if (!state.playback.isPlaying) return;
      const sampleRate = 44100;
      const startedAt = performance.now() / 1000;
      const samples = Float32Array.from({ length: 2048 }, (_, index) => {
        const time = startedAt + index / sampleRate;
        const pulse = .42 + Math.max(0, Math.sin(time * Math.PI * 3.4)) * .38;
        return Math.sin(time * Math.PI * 2 * 82) * pulse
          + Math.sin(time * Math.PI * 2 * 440) * .22
          + Math.sin(time * Math.PI * 2 * 3200) * .08;
      });
      renderer.updateAudioFrame({
        sequence: ++audioFrameSequence,
        sampleRate,
        channels: 1,
        samples,
      });
    };
    await renderer.mount(document.querySelector('#root'), {
      post(action, payload = {}) {
        console.log('[预览宿主]', action, payload);
        if (action === 'togglePlayback') state.playback.isPlaying = !state.playback.isPlaying;
        if (action === 'playPrevious' || action === 'playNext') {
          const current = state.queueTracks.findIndex((track) => track.id === state.activeTrack.id);
          const delta = action === 'playNext' ? 1 : -1;
          state.activeTrack = state.queueTracks[(current + delta + state.queueTracks.length) % state.queueTracks.length];
          state.playback.currentTime = 0;
          updateTrack();
        }
        if (action === 'toggleFavorite') state.playback.isFavorite = !state.playback.isFavorite;
        if (action === 'seekTime') state.playback.currentTime = Number(payload.time) || 0;
        if (action === 'setVolume') state.playback.volume = Number(payload.value) || 0;
        if (action === 'togglePlaybackMode') {
          state.playback.playbackMode = state.playback.playbackMode === 'fixed' ? 'shuffle' : state.playback.playbackMode === 'shuffle' ? 'repeat' : 'fixed';
          state.playback.playbackModeLabel = state.playback.playbackMode === 'shuffle' ? '随机播放' : state.playback.playbackMode === 'repeat' ? '循环播放' : '固定播放';
        }
        if (action === 'playQueueTrack' && state.queueTracks[payload.index]) {
          state.activeTrack = state.queueTracks[payload.index];
          state.playback.currentTime = 0;
          updateTrack();
        }
        updatePlayback();
      },
    });
    sendSnapshot();
    setInterval(() => {
      if (state.playback.isPlaying) state.playback.currentTime = (state.playback.currentTime + 0.1) % state.activeTrack.duration;
      updatePlayback();
    }, 100);
    setInterval(previewAudioFrame, 46);
  </script>
</body>
</html>
