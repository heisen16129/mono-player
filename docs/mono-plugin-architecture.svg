<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1190" viewBox="0 0 1120 1190"><rect width="1120" height="1190" fill="#f8fafc"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#172332;text-anchor:middle}.title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:600}.body{font-size:14px;fill:#53677d}.small{font-size:13px;fill:#53677d}</style><text x="560" y="43" class="title">Mono Player 插件架构</text><text x="560" y="71" class="body">当前实现 · 统一清单与公共 API · 插件按需提供页面和后台</text><rect x="35" y="94" width="1050" height="277" rx="12" fill="#fff" stroke="#3b82c4" stroke-width="1.5"/><text x="560" y="126" class="head">Tauri 客户端 · Vue 界面层</text><text x="560" y="153" class="body">歌曲列表 / 播放器 / 歌词页面 / 插件中心</text><rect x="55" y="174" width="320" height="78" rx="12" fill="#f0f6fc" stroke="#d1dce7" stroke-width="1.5"/><text x="215" y="205" class="head">侧栏菜单 / 播放栏插槽</text><text x="215" y="231" class="small">插件自行声明入口</text><rect x="400" y="174" width="320" height="78" rx="12" fill="#f0f6fc" stroke="#d1dce7" stroke-width="1.5"/><text x="560" y="205" class="head">插件页面容器</text><text x="560" y="231" class="small">主内容区 page / 覆盖弹窗 dialog</text><rect x="745" y="174" width="320" height="78" rx="12" fill="#f0f6fc" stroke="#d1dce7" stroke-width="1.5"/><text x="905" y="205" class="head">歌词效果容器</text><text x="905" y="231" class="small">加载插件渲染模块</text><rect x="55" y="268" width="1010" height="76" rx="12" fill="#edf3f8" stroke="#d1dce7" stroke-width="1.5"/><text x="560" y="298" class="head">公共 Plugin SDK + 前端宿主桥接</text><text x="560" y="325" class="body">隔离 iframe · MessagePort 请求 / 事件 · 页面会话与销毁</text><text x="560" y="400" class="head">↕  Tauri Commands / Events  ↕</text><rect x="35" y="423" width="1050" height="342" rx="12" fill="#fff" stroke="#27a17a" stroke-width="1.5"/><text x="560" y="456" class="head">Rust Plugin Manager · 安装与运行管理</text><text x="560" y="484" class="body">包校验 / 权限授权 / 安装更新 / 启用停用 / 卸载 / 入口注册</text><rect x="55" y="503" width="1010" height="81" rx="12" fill="#eef8f4" stroke="#d1dce7" stroke-width="1.5"/><text x="560" y="533" class="head">公共插件 API · 身份与权限检查 · 请求分发</text><text x="560" y="560" class="body">按插件 ID、包 revision 和调用会话识别插件，调用已有业务服务</text><rect x="55" y="604" width="490" height="132" rx="12" fill="#eef3f9" stroke="#d1dce7" stroke-width="1.5"/><text x="300" y="635" class="head">Node 服务运行链路</text><text x="300" y="664" class="body">小爱音箱 / 人声分离 · 独立 Node 进程</text><text x="300" y="691" class="body">服务端 SDK ↔ 本机鉴权 HTTP ↔ 公共 API</text><text x="300" y="716" class="small">页面直接 HTTP / WebSocket 请求自己的服务</text><rect x="565" y="604" width="500" height="132" rx="12" fill="#f0f6f2" stroke="#d1dce7" stroke-width="1.5"/><text x="815" y="635" class="head">Wasmtime 运行链路</text><text x="815" y="664" class="body">Rust → WASM 后端 · 按需提供</text><text x="815" y="691" class="body">宿主调用插件导出能力</text><text x="815" y="716" class="small">页面插件和小爱服务不强制依赖 WASM</text><text x="560" y="796" class="head">↕  复用宿主业务能力  ↕</text><rect x="35" y="817" width="1050" height="127" rx="12" fill="#fff" stroke="#778ca2" stroke-width="1.5"/><text x="560" y="851" class="head">现有 Rust 核心服务</text><text x="560" y="883" class="body">播放器与队列 · 音乐库 · 歌单 · 收藏 · 歌词 · 封面 · 媒体资源</text><text x="560" y="913" class="body">插件配置与存储 · 网络请求 · 桌面窗口 · 文件选择与插件后台管理</text><rect x="35" y="970" width="1050" height="173" rx="12" fill="#fff" stroke="#b3a0cf" stroke-width="1.5"/><text x="560" y="1005" class="head">插件开发与交付</text><text x="560" y="1037" class="body">plugin.json 统一声明：身份 / 权限 / 运行入口 / 页面 / 菜单 / 播放栏图标</text><text x="560" y="1069" class="body">源码 backend / ui / assets  →  构建  →  自动生成 integrity.json  →  插件ID.monoplugin.zip</text><text x="560" y="1101" class="body">导入安装包  →  校验文件哈希与清单  →  确认权限  →  解压安装  →  注册并运行</text><text x="560" y="1127" class="small">Node 与 WASM 为可选运行方式；并非每个插件都包含后台</text><text x="560" y="1171" class="small">说明：小爱页面直连其 Node 服务；图中后台运行方式按当前实现列出。</text></svg>