<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apple Music 歌词插件预览</title>
  <style>html,body,#root{width:100%;height:100%;margin:0;background:#09090a;overflow:hidden}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import renderer from './renderer.mjs';

    const lyricTexts = [
      '等风吹过盛夏的街',
      '把没说完的话写成一页',
      '远处灯火一盏一盏熄灭',
      '而你的名字仍停在唇边',
      '时间向前 我们都没有告别',
      '只是在人海里走得远了一些',
      '如果重逢发生在某个雨天',
      '我会笑着说 好久不见',
      '那些绕过城市的思念',
      '终于落在同一条地平线',
      '夜色很慢 心跳很浅',
      '故事还留着温柔的悬念',
      '等风再一次吹过窗前',
      '我们会不会回到那一年',
    ];
    const lines = lyricTexts.map((text, index) => {
      const time = 12 + index * 8;
      const chars = [...text];
      return {
        time,
        text,
        words: chars.map((char, wordIndex) => ({
          time: time + wordIndex * (5.8 / chars.length),
          duration: 5.8 / chars.length,
          text: char,
        })),
      };
    });
    const artworkDataUrl = '/examples/themes/soft-mint/background.png';
    const queueTracks = [
      ['1', '盛夏未完成', 'Mono Session', '晚风来信', 228],
      ['2', '雨落地平线', 'Mono Session', '晚风来信', 244],
      ['3', '城市漫游', 'Clara Lin', 'Night Walk', 196],
      ['4', '好久不见', 'Mono Session', '晚风来信', 215],
      ['5', 'Last Light', 'Aster', 'Afterglow', 251],
    ].map(([id, title, artist, album, duration]) => ({ id, path: id, title, artist: [artist], album, duration, artworkDataUrl }));
    const state = {
      activeTrack: queueTracks[0],
      queueTracks,
      lines,
      background: { source: 'cover', opacity: .72, windowOpacity: 1, blur: 24, positionX: 50, positionY: 50, scale: 1 },
      config: {},
      playback: { currentTime: 62, isPlaying: true, isFavorite: true, volume: 72, isMuted: false, playbackRate: 1, playbackMode: 'repeat', playbackModeLabel: '列表循环' },
      lyricsUi: { activeLyricIndex: 6, lyricTimeOffset: 0, fontSize: 17, lyricColor: null, useThemeLyricColor: true, isLoading: false, emptyMessage: '暂无歌词', loadingText: '正在载入歌词…', locale: 'zh-CN' },
    };
    const trackKey = () => `${state.activeTrack.id}:${state.activeTrack.path}`;
    const updatePlayback = () => {
      state.lyricsUi.activeLyricIndex = Math.max(-1, lines.findLastIndex((line) => line.time <= state.playback.currentTime));
      renderer.update({ type: 'playback', playback: state.playback });
      renderer.update({ type: 'lyrics-ui', lyricsUi: state.lyricsUi });
    };
    const sendSnapshot = () => {
      renderer.update({ type: 'track', trackKey: trackKey(), activeTrack: state.activeTrack });
      renderer.update({ type: 'lyrics', trackKey: trackKey(), lines: state.lines });
      renderer.update({ type: 'queue', queueTracks: state.queueTracks });
      renderer.update({ type: 'background', background: state.background });
      renderer.update({ type: 'config', config: state.config });
      updatePlayback();
    };
    const api = {
      post(action, payload = {}) {
        if (action === 'togglePlayback') state.playback.isPlaying = !state.playback.isPlaying;
        if (action === 'toggleFavorite') state.playback.isFavorite = !state.playback.isFavorite;
        if (action === 'toggleMute') state.playback.isMuted = !state.playback.isMuted;
        if (action === 'seekTime') state.playback.currentTime = Number(payload.time) || 0;
        if (action === 'setVolume') state.playback.volume = Number(payload.value) || 0;
        if (action === 'setPlaybackRate') state.playback.playbackRate = Number(payload.value) || 1;
        if (action === 'togglePlaybackMode') {
          const modes = ['repeat', 'shuffle', 'fixed'];
          state.playback.playbackMode = modes[(modes.indexOf(state.playback.playbackMode) + 1) % modes.length];
          state.playback.playbackModeLabel = { repeat: '列表循环', shuffle: '随机播放', fixed: '单曲循环' }[state.playback.playbackMode];
        }
        if (action === 'updateConfig') { state.config = payload.config || {}; renderer.update({ type: 'config', config: state.config }); }
        if (action === 'playQueueTrack' && state.queueTracks[payload.index]) {
          state.activeTrack = state.queueTracks[payload.index];
          state.playback.currentTime = 0;
          renderer.update({ type: 'track', trackKey: trackKey(), activeTrack: state.activeTrack });
        }
        updatePlayback();
      },
    };
    renderer.mount(document.querySelector('#root'), api);
    sendSnapshot();
    setInterval(() => {
      if (!state.playback.isPlaying) return;
      state.playback.currentTime = (state.playback.currentTime + 0.1 * state.playback.playbackRate) % state.activeTrack.duration;
      updatePlayback();
    }, 100);
  </script>
</body>
</html>
